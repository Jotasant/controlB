# ==============================================================================
# logging.conf - Configuração Centralizada de Logs do Sistema (ControlB)
# ==============================================================================
# Define os loggers, handlers (Arquivo e Console) e formatadores utilizados
# por toda a aplicação FastAPI, SQLAlchemy e módulos de negócio.
# ==============================================================================

[loggers]
keys=root,controlb,uvicorn,sqlalchemy

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=detailedFormatter,simpleFormatter

# ------------------------------------------------------------------------------
# LOGGERS
# ------------------------------------------------------------------------------
[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_controlb]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=controlb
propagate=0

[logger_uvicorn]
level=INFO
handlers=consoleHandler,fileHandler
qualname=uvicorn
propagate=0

[logger_sqlalchemy]
level=WARN
handlers=consoleHandler,fileHandler
qualname=sqlalchemy.engine
propagate=0

# ------------------------------------------------------------------------------
# HANDLERS
# ------------------------------------------------------------------------------
[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailedFormatter
# Arquivo, modo 'a', tamanho max 10MB, até 5 backups, utf-8
args=('logs/controlb.log', 'a', 10485760, 5, 'utf-8')

# ------------------------------------------------------------------------------
# FORMATTERS
# ------------------------------------------------------------------------------
[formatter_detailedFormatter]
format=[%(asctime)s] [%(levelname)-7s] [%(name)s:%(lineno)d] [%(threadName)s] - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_simpleFormatter]
format=[%(asctime)s] [%(levelname)-7s] [%(name)s] - %(message)s
datefmt=%H:%M:%S
