services:
  db:
    image: postgres:17-alpine
    container_name: controlb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controlb}
      POSTGRES_USER: ${POSTGRES_USER:-controlb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controlb_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ../.pg_data:/var/lib/postgresql/data
    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped