# ==============================================================================
# Nginx Configuration - ControlB Reverse Proxy
# ==============================================================================
# Ponto único de entrada (Porta 80) roteando entre:
# 1. Frontend React + Vite SPA (Porta 9090 com suporte a WebSockets/HMR)
# 2. Backend FastAPI (Porta 8000)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # ----------------------------------------------------------------------
        # 1. ROTAS DO BACKEND FASTAPI (Prioridade '^~' sobre outras rotas)
        # ----------------------------------------------------------------------

        # Swagger Docs da API
        location ^~ /docs {
            proxy_pass http://host.docker.internal:8000/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Healthcheck
        location ^~ /health {
            proxy_pass http://host.docker.internal:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Esquema OpenAPI JSON
        location ^~ /openapi.json {
            proxy_pass http://host.docker.internal:8000/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Endpoints da API de Identidade e Autenticação (/identity/token, /identity/users, etc.)
        location ^~ /identity/ {
            proxy_pass http://host.docker.internal:8000/identity/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Endpoints da API de Compras e Negociação (/purchasing/suppliers, /purchasing/requests, etc.)
        location ^~ /purchasing/ {
            proxy_pass http://host.docker.internal:8000/purchasing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Endpoints da API de Estoque e Inventário (/inventory/products, /inventory/categories, /inventory/adjust, etc.)
        location ^~ /inventory/ {
            proxy_pass http://host.docker.internal:8000/inventory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Rota da Página SPA do CRM no Frontend (Evita conflito com o prefixo da API /crm/)
        location = /crm {
            proxy_pass http://host.docker.internal:9090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /crm/ {
            proxy_pass http://host.docker.internal:9090/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoints da API de CRM (/crm/leads, /crm/opportunities, /crm/stages, /crm/interactions, etc.)
        location ^~ /crm/ {
            proxy_pass http://host.docker.internal:8000/crm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Endpoints da API de Vendas e PDV (/sales/quotes, /sales/orders, /sales/customers, /sales/pos, etc.)
        location ^~ /sales/ {
            proxy_pass http://host.docker.internal:8000/sales/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Endpoints da API de Faturamento (/billing/invoices, /billing/fiscal, etc.)
        location ^~ /billing/ {
            proxy_pass http://host.docker.internal:8000/billing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Endpoints da API Financeira (/finance/accounts, /finance/payables, /finance/receivables, etc.)
        location ^~ /finance/ {
            proxy_pass http://host.docker.internal:8000/finance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Endpoints da API de Documentos e Rastreabilidade Transversal (/documents/SALES_QUOTE/.../chain, etc.)
        location ^~ /documents/ {
            proxy_pass http://host.docker.internal:8000/documents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ----------------------------------------------------------------------
        # 2. FRONTEND REACT + VITE (SPA com suporte a WebSockets HMR)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://host.docker.internal:9090/;
            proxy_http_version 1.1;
            
            # Cabeçalhos necessários para Hot Module Replacement (HMR via WebSocket)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}