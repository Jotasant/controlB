# ==============================================================================
# Nginx Configuration - ControlB Reverse Proxy
# ==============================================================================
# Este arquivo configura o Nginx como ponto único de entrada (Porta 80) para
# encaminhar requisições entre o Frontend (porta 9090) e o Backend FastAPI (porta 8000).
# ==============================================================================

events {
    # Número máximo de conexões simultâneas que cada worker do Nginx pode abrir
    worker_connections 1024;
}

http {
    server {
        # Porta de escuta padrão HTTP
        listen 80;

        # ----------------------------------------------------------------------
        # 1. ROTAS PRINCIPAIS DO FRONTEND (Rotas Exatas '=')
        # ----------------------------------------------------------------------
        
        # Rota raiz (http://localhost/): Entrega a tela de login (index.html)
        location = / {
            proxy_pass http://host.docker.internal:9090/index.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rota limpa de login (http://localhost/login): Entrega a tela de login (index.html)
        location = /login {
            proxy_pass http://host.docker.internal:9090/index.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----------------------------------------------------------------------
        # 2. ROTAS DO BACKEND FASTAPI (Prioridade '^~' sobre expressões regulares)
        # ----------------------------------------------------------------------

        # Documentação Interativa Swagger da API (http://localhost/docs)
        location ^~ /docs {
            proxy_pass http://host.docker.internal:8000/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
	
        # Rota de verificação de saúde do sistema (Healthcheck)
        location ^~ /health {
            proxy_pass http://host.docker.internal:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Esquema OpenAPI JSON consumido pelo Swagger Docs
        location ^~ /openapi.json {
            proxy_pass http://host.docker.internal:8000/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Endpoints da API de Identidade e Autenticação (ex: /identity/token, /identity/users)
        location ^~ /identity/ {
            proxy_pass http://host.docker.internal:8000/identity/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----------------------------------------------------------------------
        # 3. ROTA DINÂMICA PARA PÁGINAS HTML SEM EXTENSÃO
        # ----------------------------------------------------------------------
        # Qualquer rota limpa (ex: /dashboard, /usuarios, /pedidos) é mapeada
        # automaticamente para o arquivo .html correspondente no frontend:
        # Ex: /dashboard -> http://host.docker.internal:9090/dashboard.html
        location ~ ^/([a-zA-Z0-9_-]+)$ {
            proxy_pass http://host.docker.internal:9090/$1.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----------------------------------------------------------------------
        # 4. ARQUIVOS ESTÁTICOS E FALLBACK GERAL
        # ----------------------------------------------------------------------
        # Encaminha requisições com barras ou extensões de arquivos (ex: /css/login.css, /js/login.js, /img/favicon.ico)
        location / {
            proxy_pass http://host.docker.internal:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}